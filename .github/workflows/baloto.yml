name: Baloto Bot Auto

on:
  schedule:
    # Se ejecuta martes, jueves y domingos a las 6:00 AM Colombia (11:00 AM UTC)
    - cron: '0 11 * * 0,2,4'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Run Baloto Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python poblar_historial.py
          python main.py
